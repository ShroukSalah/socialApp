<div>
    <form (submit)="onSubmitForm($event)">
        <div class="flex gap-5 items-center">
            <input [formControl]="newCommentControl" id="comment" rows="4"
                class="bg-[#F6F5FB] text-heading text-sm rounded-full block w-full h-[44px] shadow-xs px-5 placeholder:text-[#949090]"
                placeholder="Write a Comment..." />
            <button type="submit"
                class="text-white bg-primary h-[44px] shadow-xs font-medium leading-5 rounded-full font-bold px-5 py-3 focus:outline-none">
                Send
            </button>
        </div>
    </form>
</div>
