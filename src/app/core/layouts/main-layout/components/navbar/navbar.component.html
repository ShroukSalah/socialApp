<nav class="bg-white fixed w-full z-20 top-0 inset-s-0 border-b border-b-[#E6E3F2]">
  <div class="max-w-7xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a href="" class="flex items-center space-x-3 rtl:space-x-reverse">
      <img src="/img/lamaLogo.png" class="h-9" alt="Lamma Logo">
      <h2 class="font-bold text-[20px]">Lamma</h2>
    </a>
    <div class="flex items-center md:order-2 space-x-3 md:space-x-0 rtl:space-x-reverse">
      <button type="button"
        class="flex text-sm bg-neutral-primary rounded-full md:me-0 cursor-pointer"
        id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown"
        data-dropdown-placement="bottom">
        <span class="sr-only">Open user menu</span>
        <img class="w-8 h-8 rounded-full object-cover shadow" [src]="userData?.photo" alt="User photo" /> </button>
      <!-- Dropdown menu -->
      <div class="z-50 hidden  bg-white shadow rounded-2xl p-2 w-44"
        id="user-dropdown">
        <div class="px-4 py-3 text-sm border-b border-default">
          <span class="block font-bold mb-2">{{userData?.username}}</span>
          <span class="block text-[12px] text-[#535252]">{{userData?.email}}</span>
        </div>
        <ul class="p-2 text-sm text-body font-medium " aria-labelledby="user-menu-button">
          <li>
            <a routerLink="/profile"
              class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded">
              Profile
            </a>
          </li>

          <li>
            <a href="#"
              class="inline-flex items-center w-full p-2 hover:bg-neutral-tertiary-medium hover:text-heading rounded">Sign
              out</a>
          </li>
        </ul>
      </div>
      <button data-collapse-toggle="navbar-user" type="button"
        class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-body rounded-base md:hidden hover:bg-neutral-secondary-soft hover:text-heading focus:outline-none focus:ring-2 focus:ring-neutral-tertiary"
        aria-controls="navbar-user" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="w-6 h-6" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none"
          viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14" />
        </svg>
      </button>
    </div>
    <div class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1" id="navbar-user">
      <ul
        class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-default rounded-base bg-neutral-secondary-soft md:space-x-8 rtl:space-x-reverse md:flex-row md:mt-0 md:border-0 md:bg-neutral-primary">
        <li>
          <a routerLink="/feed" routerLinkActive="text-primary  bg-[#EEEAFF] md:text-fg-brand"
            ariaCurrentWhenActive="page" class="block py-2 px-3 rounded-sm md:p-0">
            Home
          </a>
        </li>

        <li>
          <a routerLink="/feed" routerLinkActive="text-primary  bg-[#EEEAFF] md:text-fg-brand"
            ariaCurrentWhenActive="page" class="block py-2 px-3 rounded-sm md:p-0">
            About
          </a>
        </li>
        <li>
          <a routerLink="/feed" routerLinkActive="text-primary  bg-[#EEEAFF] md:text-fg-brand"
            ariaCurrentWhenActive="page" class="block py-2 px-3 rounded-sm md:p-0">
            Services
          </a>
        </li>
        <li>
          <a routerLink="/feed" routerLinkActive="text-primary  bg-[#EEEAFF] md:text-fg-brand"
            ariaCurrentWhenActive="page" class="block py-2 px-3 rounded-sm md:p-0">
            Contact
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
