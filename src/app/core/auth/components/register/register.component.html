<section class="bg-[#eeeeee78] p-3 shadow rounded-md w-1/2 mx-auto">
    <div class="container xl:w-[95%]">
        <div>
            <h1 class="title text-3xl mb-5 text-center">
                Register Now
            </h1>
        </div>
        <div>
            <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                <div class="mb-4">
                    <label for="name" class="main-input-label">
                        Your Name
                    </label>
                    <input type="text" formControlName="name" id="name" class="main-input" placeholder="Full name" />
                </div>
                <div class="mb-4">
                    <label for="username" class="main-input-label">
                        User Name
                    </label>
                    <input type="text" formControlName="username" id="username" class="main-input"
                        placeholder="username (optional)" />
                </div>
                <div class="mb-4">
                    <label for="email" class="main-input-label">
                        Email
                    </label>
                    <input type="email" formControlName="email" id="email" class="main-input" placeholder="Email" />
                </div>

                <div class="mb-4">
                    <label for="gender" class="main-input-label">Select an
                        gender</label>
                    <select id="gender" formControlName="gender" class="main-input">
                        <option selected hidden disabled>Choose a gender</option>
                        <option value="make">male</option>
                        <option value="female">female</option>

                    </select>
                </div>
                <div class="mb-4">
                    <label for="date" class="main-input-label">
                        Date
                    </label>
                    <input type="date" formControlName="dateOfBirth" id="date" class="main-input" placeholder="" />
                </div>
                <div class="mb-4">
                    <label for="password" class="block mb-2.5 text-sm font-medium text-heading">
                        Password</label>
                    <input type="password" formControlName="password" id="password" class="main-input"
                        placeholder="Password" />
                </div>
                <div class="mb-4">
                    <label for="confirm-password" class="block mb-2.5 text-sm font-medium text-heading">
                        Confirm password</label>
                    <input type="password" formControlName="rePassword" id="confirm-password" class="main-input"
                        placeholder="Confirm password" />
                </div>
                <div class="mt-8">
                    <button type="submit"  class="main-btn">
                        Create new account
                    </button>
                </div>
            </form>
        </div>
    </div>

</section>
