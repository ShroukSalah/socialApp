<section class="pt-25 min-h-dvh">

    @if (postDetails(); as post) {
    <div class="grid lg:grid-cols-2 grid-cols-1 lg:px-37.5 px-5 gap-10">
        <div>
            @if (post.image){
            <div class="bg-white rounded-2xl">
                <img [src]="post.image" class="w-full rounded-2xl" alt="">
            </div>
            }
            @else{
            <div class="bg-[#F9D6DF] rounded-2xl w-full lg:min-h-[80vh] min-h-50"></div>
            }
        </div>
        <div class="bg-white rounded-2xl lg:p-10 p-5">
            <div class="flex gap-3 mb-4">
                <img [src]="post.user.photo" class="w-11 h-11 shadow rounded-full" [alt]="post.user.username">
                <div>
                    <h5 class="font-semibold text-[20px]">
                        {{post.user.username}}
                    </h5>
                    <span class="text-[10px] text-[#999999] font-semibold">
                        {{post.createdAt}}
                    </span>
                </div>
            </div>
            <p>
                {{post.body}}
            </p>
            <div class="mt-5">
                <div class="flex gap-6.25 mb-4">
                    <div class="flex items-center gap-2">
                        <i class="far fa-heart"></i>
                        <h6 class="lg:inline hidden">
                            Likes
                        </h6>
                        <h6 class="text-[#5E5A75]">
                            {{post.likesCount}}
                        </h6>
                    </div>
                    <div #commentsBtn class="flex items-center gap-2 cursor-pointer">
                        <i class="far fa-comment-alt"></i>
                        <h6 class="lg:inline hidden">
                            Comments
                        </h6>
                        <h6 class="text-[#5E5A75]">
                            {{post.commentsCount}}
                        </h6>
                    </div>
                    <div class="flex items-center gap-2">
                        <i class="fas fa-share"></i>
                        <h6 class="lg:inline hidden">
                            Share
                        </h6>
                        <h6 class="text-[#5E5A75]">
                            {{post.sharesCount}}
                        </h6>
                    </div>
                </div>
                @defer(on interaction(commentsBtn)){
                <app-comments [postId]="post.id" />
                }
                <app-create-comment [postId]="post.id"></app-create-comment>
            </div>
        </div>
    </div>
    }

</section>
